; PlatformIO project for developing and checking BlueIMU.
;
;   pio run                  build the BasicAHRS example for every board env
;   pio run -e uno           build for one board (prints flash/RAM use)
;   pio test -e native       host unit tests (doctest), libm atan2f
;   pio test -e native_fast  host unit tests with -DBLUEIMU_FAST_TRIG
;
; To use BlueIMU in your own PlatformIO project instead, add to its platformio.ini:
;   lib_deps = https://github.com/daPhoosa/BlueIMU.git

[platformio]
src_dir = examples/BasicAHRS
default_envs = uno, teensy41, esp32dev

[env]
lib_deps = symlink://.

[arduino]
framework = arduino

[env:uno]
extends = arduino
platform = atmelavr
board = uno

[env:teensy41]
extends = arduino
platform = teensy
board = teensy41

[env:esp32dev]
extends = arduino
platform = espressif32
board = esp32dev

; Host unit tests (same sources as `make -C test`)
[native_base]
platform = native
test_framework = doctest
test_build_src = no
; Strict library warnings (-Werror, no double math) are enforced by `make -C test`;
; here they would also fire on doctest and the test code.
; BLUEIMU_PIO_TEST_REPORT: print passing test cases so PlatformIO can count them (test_main.cpp)
build_flags = -std=gnu++11 -Itest/stub -Itest -DBLUEIMU_PIO_TEST_REPORT
build_unflags = -std=gnu++17
lib_compat_mode = off

[env:native]
extends = native_base

[env:native_fast]
extends = native_base
build_flags = ${native_base.build_flags} -DBLUEIMU_FAST_TRIG
